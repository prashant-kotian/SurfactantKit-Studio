name: tests

# Runs the Studio test suite against SurfactantKit from its GitHub repository.
# While that repository is private, add a repository secret TOOLKIT_TOKEN (a read-only token
# for prashant-kotian/Surfactant-Toolkit); once it is public the default token is enough.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: prashant-kotian/Surfactant-Toolkit
          path: surfactant-toolkit
          token: ${{ secrets.TOOLKIT_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./surfactant-toolkit[calc]"
          python -m pip install -e ".[dev]"
      - name: Test (no network, no Ollama)
        run: python -m pytest -q
