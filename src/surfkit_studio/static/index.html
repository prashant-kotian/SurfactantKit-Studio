<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SurfactantKit Studio</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%230072b2'/%3E%3C/svg%3E">
</head>
<body>
<header class="bar">
  <div class="brand">SurfactantKit Studio <span class="tag">runs locally &middot; your data stays on this computer</span></div>
  <label class="ai" title="Off by default. When on, typing 'search: your keywords' in the chat sends only those keywords to OpenAlex (or Crossref) and lists matching papers. Your data never leaves this computer.">
    <input type="checkbox" id="web-toggle"> <span id="web-status">Search literature online: off</span>
  </label>
  <div class="report">
    <input id="sample" placeholder="Sample name (for the report)">
    <button id="dl-docx" class="secondary" disabled>Report .docx</button>
    <button id="dl-pdf" class="secondary" disabled>Report .pdf</button>
  </div>
</header>
<main class="layout">
  <section class="chat" aria-label="Chat">
    <div id="log" class="log" aria-live="polite"></div>
    <form id="chat-form" class="composer">
      <input id="msg" autocomplete="off" placeholder="e.g. I have surface tension data and want the CMC, or: which formula does Rubingh use?">
      <button>Send</button>
    </form>
  </section>
  <section class="side" aria-label="Techniques">
    <div class="workbook" title="One Excel file for a whole binary-mixture study: pure surfactants, mixtures, optional temperature series. You get back a completed workbook (results, Excel Solver sheets beside the toolkit's values, flags) and every plot as PNG and xmgrace .agr.">
      <strong>Workbook mode</strong>
      <a class="btn secondary" href="/api/workbook/template.xlsx">Download template</a>
      <label class="btn secondary">Upload filled workbook <input type="file" id="wb-file" accept=".xlsx" hidden></label>
    </div>
    <nav id="tree" class="tree"></nav>
    <div id="panel" class="panel">
      <p class="muted">Pick a technique from the list above, or describe your data in the chat.</p>
    </div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
